<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:fixed;top:0;left:0;right:0;z-index:40;height:64px;display:flex;align-items:center;gap:24px;padding:0 24px;background:{{ hbg }};backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 {{ line }};transition:background 320ms,box-shadow 320ms;font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;letter-spacing:-0.01em;word-break:keep-all;">
  <a href="Landing.dc.html" style="display:flex;align-items:center;flex:none;"><img src="{{ logo }}" alt="D voice" style="height:30px;width:auto;display:block;"></a>
  <nav aria-label="주 메뉴" style="flex:1 1 0;min-width:0;height:40px;display:{{ navDisplay }};justify-content:center;gap:4px;">
    <sc-for list="{{ nav }}" as="n" hint-placeholder-count="4">
      <div onMouseEnter="{{ n.enter }}" onMouseLeave="{{ n.leave }}" style="position:relative;display:flex;">
        <sc-if value="{{ n.isLink }}" hint-placeholder-val="{{ true }}">
          <a href="{{ n.href }}" aria-current="{{ n.cur }}" style="height:40px;padding:0 14px;display:flex;align-items:center;border-radius:10px;font-size:15px;font-weight:{{ n.fw }};color:{{ n.c }};background:{{ n.bg }};transition:background 200ms,color 200ms;" style-hover="background:{{ hoverBg }};color:{{ hoverFg }};">{{ n.label }}</a>
        </sc-if>
        <sc-if value="{{ n.isMenu }}" hint-placeholder-val="{{ false }}">
          <a href="{{ n.mhref }}" onClick="{{ n.tap }}" aria-expanded="{{ n.exp }}" aria-haspopup="true" style="height:40px;padding:0 10px 0 14px;display:flex;align-items:center;gap:4px;border:none;border-radius:10px;font-size:15px;font-weight:{{ n.fw }};color:{{ n.c }};background:{{ n.bg }};cursor:pointer;transition:background 200ms,color 200ms;" style-hover="background:{{ hoverBg }};color:{{ hoverFg }};">{{ n.label }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate({{ n.rot }});transition:transform 300ms cubic-bezier(0.22,1,0.36,1);"><path d="M6 9l6 6 6-6"></path></svg></a>
          <div role="menu" aria-label="{{ n.label }}" style="position:absolute;top:50px;left:-8px;width:{{ n.pw }};padding:12px;border-radius:24px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,0.05),0 30px 70px -24px rgba(20,30,60,0.28);display:grid;grid-template-columns:{{ n.cols }};gap:8px;opacity:{{ n.op }};visibility:{{ n.vis }};pointer-events:{{ n.pe }};transform:translateY({{ n.ty }}) scale({{ n.sc }});transform-origin:20% 0;transition:opacity 260ms cubic-bezier(0.22,1,0.36,1),transform 360ms cubic-bezier(0.22,1,0.36,1),visibility 0ms {{ n.visDelay }};">
            <span aria-hidden="true" style="position:absolute;left:0;right:0;top:-14px;height:14px;"></span>
            <sc-if value="{{ n.hasFeat }}" hint-placeholder-val="{{ false }}">
              <a href="{{ n.feat.href }}" role="menuitem" style="border-radius:18px;padding:20px;background:radial-gradient(90% 110% at 100% 0%, #E2E7FC 0%, rgba(226,231,252,0) 60%),#F4F6FE;display:flex;flex-direction:column;gap:8px;color:#191F28;transition:background 200ms;" style-hover="color:#191F28;background:#EDF0FD;">
                <span style="font-size:13px;font-weight:700;color:#2B45D4;">{{ n.feat.k }}</span>
                <b style="font-size:18px;line-height:1.4;font-weight:700;letter-spacing:-0.02em;">{{ n.feat.t }}</b>
                <span style="font-size:13px;line-height:1.55;color:#6B7684;">{{ n.feat.d }}</span>
                <span style="margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#2B45D4;">{{ n.feat.cta }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
              </a>
            </sc-if>
            <div style="display:grid;grid-template-columns:{{ n.listCols }};gap:2px;align-content:start;">
              <sc-for list="{{ n.items }}" as="it" hint-placeholder-count="3">
                <a href="{{ it.href }}" role="menuitem" style="border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;color:#191F28;transition:background 200ms;" style-hover="background:#F7F8FA;color:#191F28;">
                  <b style="font-size:15px;font-weight:700;">{{ it.t }}</b>
                  <span style="font-size:13px;line-height:1.5;color:#8B95A1;">{{ it.d }}</span>
                </a>
              </sc-for>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </nav>
  <div style="display:flex;gap:8px;flex:none;margin-left:auto;">
    <a href="Features.dc.html#summary" style-hover="filter:brightness(0.97);" style="height:40px;padding:0 12px 0 16px;display:flex;align-items:center;gap:6px;border-radius:12px;background:{{ secBg }};color:{{ secFg }};font-weight:600;font-size:15px;transition:background 320ms,color 320ms;" style-active="transform:scale(0.97);">3분 요약 보기<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    <a href="Landing.dc.html#cta" style-hover="translate:0 -2px;filter:brightness(1.06);" style="height:40px;padding:0 16px;display:flex;align-items:center;border-radius:12px;background:#2B45D4;color:#fff;font-weight:600;font-size:15px;transition:translate 260ms cubic-bezier(0.22,1,0.36,1),filter 260ms;">2주 콜 진단 신청</a>
  </div>
</header>
</x-dc>
